name: Deploy Frontend

# Builds with Vite here and uploads Frontend/dist; the SWA action does not rebuild.
on:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Build
        working-directory: Frontend
        env:
          VITE_API_URL: https://site-audit-backend.azurewebsites.net
          VITE_BACKEND_URL: https://site-audit-backend.azurewebsites.net
          VITE_GOOGLE_CLIENT_ID: 379800555800-3hi297bstiqpegs4sebjqe68tgt8p7ne.apps.googleusercontent.com
          VITE_GOOGLE_REDIRECT_PATH: /dashboard/gsc
        run: |
          npm ci
          npm run build

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: Frontend/dist
          skip_app_build: true
          skip_api_build: true
