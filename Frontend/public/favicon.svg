<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .icon-shape { fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .icon-shape { fill: #ffffff; }
    }
  </style>
  <g class="icon-shape">
    <!-- Outer Eye -->
    <path d="M 50 20 C 22 20 6 45 4 50 C 6 55 22 80 50 80 C 78 80 94 55 96 50 C 94 45 78 20 50 20 Z M 50 72 C 30 72 16 53 12 50 C 16 47 30 28 50 28 C 70 28 84 47 88 50 C 84 53 70 72 50 72 Z" />
    <!-- Center Iris / Magnifying Glass Ring -->
    <circle cx="50" cy="50" r="18" fill="none" stroke="currentColor" stroke-width="7" />
    <!-- Center Gear Tooth Accents -->
    <circle cx="50" cy="50" r="8" />
    <rect x="47" y="27" width="6" height="6" rx="1.5" />
    <rect x="47" y="67" width="6" height="6" rx="1.5" />
    <rect x="27" y="47" width="6" height="6" rx="1.5" />
    <rect x="67" y="47" width="6" height="6" rx="1.5" />
    <!-- Magnifying Handle -->
    <rect x="67" y="65" width="8" height="20" rx="4" transform="rotate(-45 67 65)" />
  </g>
</svg>
